name: Build Windows server

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build
        run: pyinstaller --noconfirm firefox_extension/server/tpd-server.spec

      - name: Smoke test
        shell: pwsh
        run: |
          $server = Start-Process dist/tpd-server/tpd-server.exe -ArgumentList "--port", "8765" -PassThru
          try {
            for ($i = 0; $i -lt 60; $i++) {
              try { Invoke-WebRequest "http://127.0.0.1:8765/site?url=https://example.com" -UseBasicParsing | Out-Null; break }
              catch { Start-Sleep -Seconds 1 }
            }
            # A site with a real privacy policy, so classification and PoliGraph run.
            $r = Invoke-RestMethod "http://127.0.0.1:8765/analyze?url=https://www.bbc.com" -TimeoutSec 300
            if ($r.error) { throw "analyze failed: $($r.error)" }
            if (-not $r.poligraph) { throw "PoliGraph did not run" }
            if ($r.sharing_relations.Count -eq 0) { throw "no sharing relations extracted" }
            Write-Host "relations: $($r.sharing_relations.Count)"
          } finally {
            Stop-Process -Id $server.Id -Force
          }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/tpd-server -DestinationPath tpd-server-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tpd-server-windows
          path: tpd-server-windows.zip
